<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Pixel Office — 15F Ocean View</title>
<style>
/* ============================================
   [STYLE-1] 리셋 & 기본
   ============================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;font-family:'Segoe UI','맑은 고딕',sans-serif;user-select:none}
canvas#game{display:block;position:fixed;top:0;left:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;z-index:1;cursor:default}

/* ============================================
   [STYLE-2] HUD 상단바
   ============================================ */
#hud{position:fixed;top:0;left:0;width:100%;height:34px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 10px;z-index:100;gap:8px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{color:#fff;font-weight:900;font-size:12px;letter-spacing:1px}.logo span{color:#4ECDC4}
.fbtn{padding:2px 9px;border:1px solid rgba(255,255,255,.18);border-radius:4px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);font-size:10px;cursor:pointer;transition:.15s}
.fbtn:hover,.fbtn.on{background:rgba(78,205,196,.35);border-color:#4ECDC4;color:#fff}
#info{color:rgba(255,255,255,.4);font-size:10px;margin-left:auto;white-space:nowrap}

/* ============================================
   [STYLE-3] 호버 툴팁
   ============================================ */
#tooltip{position:fixed;pointer-events:none;z-index:200;padding:8px 12px;background:rgba(13,17,23,.94);backdrop-filter:blur(10px);border:1px solid rgba(78,205,196,.3);border-radius:8px;color:#fff;font-size:11px;line-height:1.6;display:none;max-width:220px;white-space:nowrap}
#tooltip .tname{font-weight:700;color:#4ECDC4;font-size:12px}
#tooltip .tstate{color:#FFD93D}
#tooltip .tloc{color:rgba(255,255,255,.4);font-size:9px}

/* ============================================
   [STYLE-4] 채팅 패널
   ============================================ */
#chatP{position:fixed;right:0;top:34px;width:280px;height:calc(100% - 34px);background:rgba(13,17,23,.94);backdrop-filter:blur(12px);border-left:1px solid rgba(255,255,255,.08);z-index:90;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
#chatP.open{transform:translateX(0)}
#chatH{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:5px}
.ct{padding:2px 9px;border-radius:10px;font-size:10px;color:rgba(255,255,255,.35);cursor:pointer;border:1px solid transparent;transition:.15s}
.ct.on{color:#fff;background:rgba(78,205,196,.25);border-color:#4ECDC4}
#chatX{margin-left:auto;color:rgba(255,255,255,.3);cursor:pointer;font-size:15px}
#chatMsgs{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px;font-size:11px}
#chatMsgs::-webkit-scrollbar{width:3px}
#chatMsgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.cm{padding:5px 8px;border-radius:6px;line-height:1.5;max-width:88%;word-break:break-word}
.cm.me{background:rgba(78,205,196,.18);color:#fff;align-self:flex-end}
.cm.ot{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);align-self:flex-start}
.cm b{font-size:9px;color:#4ECDC4;display:block}
#chatTgt{padding:3px 8px;font-size:10px;color:rgba(255,255,255,.35);border-bottom:1px solid rgba(255,255,255,.04);display:none}
#chatTgt em{color:#FF6B6B;font-style:normal;font-weight:700}
#chatTgt u{color:#4ECDC4;cursor:pointer;margin-left:5px;text-decoration:none}
#chatIn{display:flex;padding:6px;gap:4px;border-top:1px solid rgba(255,255,255,.08)}
#chatIn input{flex:1;padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:6px;background:rgba(255,255,255,.04);color:#fff;font-size:11px;outline:none}
#chatIn input:focus{border-color:#4ECDC4}
#chatIn button{padding:5px 12px;border:none;border-radius:6px;background:#4ECDC4;color:#000;font-weight:700;font-size:11px;cursor:pointer}

/* ============================================
   [STYLE-5] 하단 툴바
   ============================================ */
#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:100}
.bb{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.bb:hover{background:rgba(78,205,196,.3);border-color:#4ECDC4}
.bb:active{transform:scale(.92)}

/* ============================================
   [STYLE-6] 도움말
   ============================================ */
#helpO{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:198;display:none}
#helpM{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,17,23,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:24px;color:#fff;z-index:199;max-width:400px;width:90%;display:none}
#helpM h2{font-size:16px;margin-bottom:12px;color:#4ECDC4}
#helpM p{font-size:11px;line-height:1.9;color:rgba(255,255,255,.65);margin-bottom:6px}
#helpM kbd{padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.12);font-size:10px}
#helpM .hx{position:absolute;top:10px;right:12px;color:rgba(255,255,255,.3);cursor:pointer;font-size:18px}
</style>
</head>
<body>

<!-- [HTML-1] 상단 HUD -->
<div id="hud">
  <div class="logo">PIXEL<span>OFFICE</span></div>
  <button class="fbtn on" data-f="15">15F 라운지</button>
  <button class="fbtn" data-f="14">14F 업무</button>
  <button class="fbtn" data-f="13">13F 회의</button>
  <span id="info">100명 | 15F</span>
</div>

<!-- [HTML-2] 호버 툴팁 -->
<div id="tooltip">
  <div class="tname"></div>
  <div class="tstate"></div>
  <div class="tloc"></div>
</div>

<!-- [HTML-3] 캔버스 -->
<canvas id="game"></canvas>

<!-- [HTML-4] 채팅 패널 -->
<div id="chatP">
  <div id="chatH">
    <div class="ct on" data-m="all">전체</div>
    <div class="ct" data-m="dm">1:1</div>
    <span id="chatX">&times;</span>
  </div>
  <div id="chatTgt"><em id="tgtN"></em>에게 DM <u id="tgtC">취소</u></div>
  <div id="chatMsgs"></div>
  <div id="chatIn">
    <input id="msgI" placeholder="Enter로 채팅..." maxlength="200">
    <button id="msgB">전송</button>
  </div>
</div>

<!-- [HTML-5] 하단 툴바 -->
<div id="bar">
  <button class="bb" id="bChat" title="채팅">💬</button>
  <button class="bb" id="bUp" title="위로 보기">🔼</button>
  <button class="bb" id="bDown" title="아래로 보기">🔽</button>
  <button class="bb" id="bZoomIn" title="확대">➕</button>
  <button class="bb" id="bZoomOut" title="축소">➖</button>
  <button class="bb" id="bHelp" title="도움말">❓</button>
</div>

<!-- [HTML-6] 도움말 -->
<div id="helpO"></div>
<div id="helpM">
  <span class="hx" id="hx">&times;</span>
  <h2>조작법</h2>
  <p>🖱️ <b>클릭</b> — 사람 선택/이동 지점 지정</p>
  <p><kbd>W</kbd><kbd>S</kbd> 또는 <kbd>↑</kbd><kbd>↓</kbd> — 뷰 올려보기/내려보기</p>
  <p><kbd>A</kbd><kbd>D</kbd> 또는 <kbd>←</kbd><kbd>→</kbd> — 뷰 좌우 이동</p>
  <p><kbd>Enter</kbd> — 채팅 열기/전송</p>
  <p><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> — 층 이동</p>
  <p><kbd>+</kbd><kbd>-</kbd> — 줌 인/아웃</p>
  <p>🖱️ <b>호버</b> — 사람 상태 표시</p>
  <p>🖱️ <b>더블클릭</b> — 선택 사람에게 DM</p>
</div>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  PIXEL OFFICE — 15층 통유리 오피스 내부 뷰                    ║
   ║  크루즈 항구 & 언덕 배경 / 100명 / 3층 / 물리 / 메시지       ║
   ╚══════════════════════════════════════════════════════════════╝ */
(function(){
"use strict";

/* ============================================
   [SEC-1] 캔버스 초기화
   ============================================ */
var cv=document.getElementById('game'),
    cx=cv.getContext('2d'),
    W,H;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();
window.addEventListener('resize',resize);

/* ============================================
   [SEC-2] 전역 상수 & 변수
   ============================================ */
var TICK=0,
    /* 뷰 컨트롤 */
    viewY=0.5,        /* 0=위(하늘많이)  1=아래(바닥많이) — 기본 0.5 */
    viewX=0.5,        /* 0=좌  1=우 — 기본 중앙 */
    viewZoom=1.0,
    /* 층 */
    curFloor=15,
    /* 선택된 사람 */
    selPerson=null,
    hoverPerson=null,
    /* 마우스 */
    mx=0,my=0,
    /* 채팅 */
    chatMode='all',dmTgt=null,chatMsgs=[];

/* ============================================
   [SEC-3] 색상 팔레트 — 100가지 캐릭터 조합
   ============================================ */
var SKINS=['#FFDBB5','#F5C5A3','#D2956A','#C68642','#8D5524','#FFCBA4','#E8B88A','#A0724A','#F9E0C0','#D4A97A'];
var HAIRS=['#2C1B0E','#5C3317','#8B4513','#D4A44C','#F5D060','#C0392B','#E74C3C','#8E44AD','#2980B9','#1ABC9C'];
var SHIRTS=['#E74C3C','#3498DB','#2ECC71','#F39C12','#9B59B6','#1ABC9C','#E67E22','#EC407A','#AB47BC','#26A69A',
  '#42A5F5','#66BB6A','#FFA726','#EF5350','#7E57C2','#26C6DA','#D4E157','#FF7043','#8D6E63','#78909C'];
var PANTS=['#2C3E50','#1A237E','#263238','#37474F','#4E342E','#212121','#455A64','#3E2723','#1B5E20','#4A148C'];
var HSTYLES=['short','long','mohawk','bun','curly','ponytail','buzz','side','afro','bald'];
var ACCS=['none','glasses','sunglasses','hat','cap','headband','earring','mask','scarf','bowtie'];

/* 상태 목록 */
var STATES=['☕ 커피 마시는 중','💻 코딩 중','📱 폰 보는 중','🚶 이동 중','💬 대화 중',
  '📋 문서 작업 중','🎧 음악 듣는 중','📞 전화 중','🍕 간식 먹는 중','😴 잠깐 휴식',
  '📊 발표 준비 중','🖊️ 메모 중','📖 읽는 중','🤔 생각 중','🎨 디자인 중',
  '🔍 검색 중','📧 이메일 확인','🗂️ 정리 중','☕ 카페 주문 중','👋 인사 중'];

var NAMES=['민준','서연','지호','하은','예준','수아','도윤','지우','시우','하린',
  '준서','소율','현우','다은','지훈','채원','건우','유진','선우','나윤',
  '민서','지아','우진','시은','재윤','서윤','태윤','윤서','동현','아린',
  'Alex','Emma','Jake','Mia','Leo','Zoe','Kai','Luna','Finn','Aria',
  'Noah','Lily','Liam','Chloe','Evan','Ivy','Ryan','Nora','Sam','Ruby',
  'Max','Ella','Tom','Amy','Dan','Joy','Ben','Mae','Ian','Sky',
  '유나','하준','소미','준혁','지민','태희','성민','보람','재현','은지',
  '현서','다인','승우','소연','정우','미래','태민','하나','원준','별이',
  '세진','가은','호진','나래','진우','온유','규민','다솔','용준','이슬',
  '창민','세라','형준','수빈','기현','혜원','대한','미소','한결','고운'];

var NPC_PHRASES=['커피 한잔 할까요?','오늘 미팅 몇 시에요?','점심 뭐 먹을까요?','코드 리뷰 부탁!',
  '디자인 피드백 좀요~','서버 배포 완료!','좋은 아침!','회의실 예약했어요','런치 같이 가요!',
  'PR 올렸습니다!','LGTM 👍','화이팅! 💪','잠깐 쉬어요','버그 찾았어요 ㅠ','넵 확인!'];

/* ============================================
   [SEC-4] 사람 데이터 생성
   ============================================ */
var people=[];

function mkPerson(i){
  var floor=i<34?15:i<67?14:13;
  /* 층별 바닥 Y 영역 (화면 비율) */
  var fyMin,fyMax;
  if(floor===15){fyMin=0.52;fyMax=0.88;}
  else if(floor===14){fyMin=0.50;fyMax=0.86;}
  else{fyMin=0.48;fyMax=0.84;}

  var state=STATES[i%STATES.length];
  var isSitting=state.indexOf('코딩')>-1||state.indexOf('문서')>-1||state.indexOf('폰')>-1||
                state.indexOf('디자인')>-1||state.indexOf('검색')>-1||state.indexOf('이메일')>-1||
                state.indexOf('메모')>-1;
  var isWalking=state.indexOf('이동')>-1||state.indexOf('인사')>-1||state.indexOf('카페')>-1;

  return{
    id:i,
    name:NAMES[i%NAMES.length],
    floor:floor,
    /* 비율 좌표 (0~1) */
    rx:0.08+Math.random()*0.84,
    ry:fyMin+Math.random()*(fyMax-fyMin),
    vx:0,vy:0,
    /* 이동 목표 */
    tx:null,ty:null,
    /* 스타일 */
    skin:SKINS[i%10],
    hair:HAIRS[(i*3+1)%10],
    shirt:SHIRTS[(i*7+2)%20],
    pants:PANTS[(i*11+3)%10],
    hstyle:HSTYLES[(i*13+5)%10],
    acc:ACCS[(i*17+7)%10],
    /* 상태 */
    state:state,
    sitting:isSitting,
    walking:isWalking,
    /* 애니 */
    dir:0,frame:0,animT:0,
    bobPhase:Math.random()*6.28,
    /* 물리 반경 */
    radius:12,
    /* 말풍선 */
    bubble:null,
    emoji:null,
    /* AI */
    aiTimer:Math.random()*200|0,
    selected:false
  };
}

function initPeople(){
  people=[];
  for(var i=0;i<100;i++) people.push(mkPerson(i));
}

/* ============================================
   [SEC-5] 가구 데이터 (이케아 스타일)
   ============================================ */
/* 가구: {type, rx, ry, floor, w, h} — 비율 좌표 */
var furniture=[];

function initFurniture(){
  furniture=[];
  var f,r,c;

  /* === 15F 라운지 === */
  /* 카페 카운터 (좌측 상단) */
  furniture.push({type:'counter',rx:0.08,ry:0.55,floor:15,w:120,h:35});
  furniture.push({type:'coffee',rx:0.14,ry:0.54,floor:15,w:24,h:28});
  furniture.push({type:'coffee',rx:0.18,ry:0.54,floor:15,w:24,h:28});

  /* 라운지 소파 그룹 */
  for(r=0;r<2;r++){
    for(c=0;c<3;c++){
      furniture.push({type:'sofa',rx:0.30+c*0.12,ry:0.58+r*0.14,floor:15,w:50,h:30});
      furniture.push({type:'ctable',rx:0.32+c*0.12,ry:0.62+r*0.14,floor:15,w:28,h:18});
    }
  }

  /* 화분 — 창가 라인 */
  for(c=0;c<6;c++){
    furniture.push({type:'plant',rx:0.10+c*0.15,ry:0.50,floor:15,w:20,h:30});
  }

  /* 바 스툴 */
  for(c=0;c<4;c++){
    furniture.push({type:'stool',rx:0.09+c*0.03,ry:0.58,floor:15,w:16,h:16});
  }

  /* 북셸프 */
  furniture.push({type:'bookshelf',rx:0.88,ry:0.55,floor:15,w:35,h:50});
  furniture.push({type:'bookshelf',rx:0.92,ry:0.55,floor:15,w:35,h:50});

  /* === 14F 업무 공간 === */
  /* 책상 + 모니터 배열 (4행 6열) */
  for(r=0;r<4;r++){
    for(c=0;c<6;c++){
      var dx=0.10+c*0.13;
      var dy=0.54+r*0.10;
      furniture.push({type:'desk',rx:dx,ry:dy,floor:14,w:56,h:28});
      furniture.push({type:'monitor',rx:dx+0.01,ry:dy-0.01,floor:14,w:20,h:16});
      furniture.push({type:'chair',rx:dx+0.01,ry:dy+0.04,floor:14,w:18,h:18});
    }
  }

  /* 화이트보드 */
  furniture.push({type:'whiteboard',rx:0.50,ry:0.50,floor:14,w:60,h:10});

  /* 프린터 */
  furniture.push({type:'printer',rx:0.90,ry:0.70,floor:14,w:28,h:22});

  /* 화분 — 창가 */
  for(c=0;c<5;c++){
    furniture.push({type:'plant',rx:0.12+c*0.18,ry:0.50,floor:14,w:20,h:30});
  }

  /* 워터쿨러 */
  furniture.push({type:'water',rx:0.88,ry:0.56,floor:14,w:16,h:24});

  /* === 13F 회의실 === */
  /* 대형 회의 테이블 */
  furniture.push({type:'mtable',rx:0.30,ry:0.62,floor:13,w:140,h:50});

  /* 회의 의자 */
  for(c=0;c<8;c++){
    furniture.push({type:'mchair',rx:0.22+c*0.04,ry:0.58,floor:13,w:14,h:14});
    furniture.push({type:'mchair',rx:0.22+c*0.04,ry:0.68,floor:13,w:14,h:14});
  }

  /* 소회의실 2개 */
  for(var rm=0;rm<2;rm++){
    var bx=0.65+rm*0.16;
    furniture.push({type:'mtable',rx:bx,ry:0.60,floor:13,w:60,h:30});
    for(c=0;c<3;c++){
      furniture.push({type:'mchair',rx:bx-0.02+c*0.03,ry:0.56,floor:13,w:14,h:14});
      furniture.push({type:'mchair',rx:bx-0.02+c*0.03,ry:0.64,floor:13,w:14,h:14});
    }
  }

  /* 프로젝터 스크린 */
  furniture.push({type:'screen',rx:0.30,ry:0.52,floor:13,w:100,h:8});

  /* 화분 */
  for(c=0;c<4;c++){
    furniture.push({type:'plant',rx:0.15+c*0.22,ry:0.50,floor:13,w:20,h:30});
  }
}

/* ============================================
   [SEC-6] 배경 그리기 — 창밖 크루즈 항구 뷰
   ============================================ */

/* 배경 요소 (구름, 비행기, 배, 패러글라이딩) */
var bgEls=[];
function initBg(){
  bgEls=[];
  var i;
  for(i=0;i<12;i++) bgEls.push({t:'cloud',x:Math.random()*2,y:0.05+Math.random()*0.18,sp:0.00008+Math.random()*0.00015,sz:0.04+Math.random()*0.05,op:0.5+Math.random()*0.4});
  for(i=0;i<2;i++) bgEls.push({t:'plane',x:Math.random()*1.5,y:0.06+Math.random()*0.1,sp:0.0003+Math.random()*0.0002,sz:0.02+Math.random()*0.01});
  bgEls.push({t:'cruise',x:0.3,y:0.34,sp:0.00003,sz:0.06});
  bgEls.push({t:'cruise',x:0.65,y:0.36,sp:0.00002,sz:0.04});
  for(i=0;i<3;i++) bgEls.push({t:'ship',x:0.1+Math.random()*0.8,y:0.33+Math.random()*0.06,sp:0.00005+Math.random()*0.00005,sz:0.015+Math.random()*0.01});
  for(i=0;i<2;i++) bgEls.push({t:'para',x:0.2+Math.random()*0.6,y:0.12+Math.random()*0.08,sp:0.0001+Math.random()*0.0001,sz:0.012,ph:Math.random()*6.28});
  for(i=0;i<6;i++) bgEls.push({t:'bird',x:Math.random()*1.5,y:0.08+Math.random()*0.15,sp:0.0002+Math.random()*0.0002,sz:3+Math.random()*3,ph:Math.random()*6.28});
}

function drawBg(){
  /* 창 영역 (상단 ~48%) */
  var winTop=34; /* HUD 아래 */
  var winH=H*0.48-viewY*H*0.15;
  var winBot=winTop+winH;
  var vOff=viewY*60; /* 뷰 Y에 따른 오프셋 */
  var hOff=(viewX-0.5)*120;

  /* --- 하늘 --- */
  var sky=cx.createLinearGradient(0,winTop,0,winBot);
  sky.addColorStop(0,'#5BAADB');
  sky.addColorStop(0.3,'#87CEEB');
  sky.addColorStop(0.55,'#B0E2FF');
  sky.addColorStop(0.7,'#E0F0FF');
  sky.addColorStop(0.82,'#6BC5E8');
  sky.addColorStop(1,'#1976D2');
  cx.fillStyle=sky;
  cx.fillRect(0,winTop,W,winH);

  /* --- 태양 --- */
  var sunX=W*0.8+hOff*0.3;
  var sunY=winTop+winH*0.12-vOff*0.5;
  var sg=cx.createRadialGradient(sunX,sunY,5,sunX,sunY,60);
  sg.addColorStop(0,'rgba(255,255,220,1)');
  sg.addColorStop(0.4,'rgba(255,240,180,0.5)');
  sg.addColorStop(1,'rgba(255,200,100,0)');
  cx.fillStyle=sg;cx.beginPath();cx.arc(sunX,sunY,60,0,Math.PI*2);cx.fill();

  /* --- 산 (좌측 먼 산) --- */
  var mBase=winBot-winH*0.18+vOff*0.4;
  cx.fillStyle='#7986CB';
  cx.beginPath();
  cx.moveTo(-50+hOff*0.2,mBase);
  cx.lineTo(W*0.05+hOff*0.2,mBase-winH*0.22);
  cx.lineTo(W*0.12+hOff*0.2,mBase-winH*0.15);
  cx.lineTo(W*0.18+hOff*0.2,mBase-winH*0.28);
  cx.lineTo(W*0.28+hOff*0.2,mBase-winH*0.12);
  cx.lineTo(W*0.35+hOff*0.2,mBase-winH*0.20);
  cx.lineTo(W*0.42+hOff*0.2,mBase);
  cx.closePath();cx.fill();

  /* 눈 */
  cx.fillStyle='rgba(255,255,255,0.5)';
  cx.beginPath();
  cx.moveTo(W*0.18+hOff*0.2,mBase-winH*0.28);
  cx.lineTo(W*0.15+hOff*0.2,mBase-winH*0.22);
  cx.lineTo(W*0.21+hOff*0.2,mBase-winH*0.22);
  cx.closePath();cx.fill();

  /* --- 우측 낮은 언덕 --- */
  cx.fillStyle='#66BB6A';
  cx.beginPath();
  cx.moveTo(W*0.55+hOff*0.3,mBase+winH*0.05);
  cx.quadraticCurveTo(W*0.7+hOff*0.3,mBase-winH*0.12,W*0.85+hOff*0.3,mBase+winH*0.02);
  cx.quadraticCurveTo(W*0.95+hOff*0.3,mBase-winH*0.06,W+50+hOff*0.3,mBase+winH*0.05);
  cx.lineTo(W+50,mBase+winH*0.1);
  cx.lineTo(W*0.55+hOff*0.3,mBase+winH*0.1);
  cx.closePath();cx.fill();

  /* 언덕 위 나무들 */
  cx.fillStyle='#43A047';
  var treeXs=[0.62,0.68,0.74,0.78,0.82,0.88];
  for(var ti=0;ti<treeXs.length;ti++){
    var ttx=W*treeXs[ti]+hOff*0.3;
    var tty=mBase-winH*0.02-Math.sin(treeXs[ti]*8)*winH*0.04;
    cx.beginPath();cx.moveTo(ttx,tty);
    cx.lineTo(ttx-6,tty+12);cx.lineTo(ttx+6,tty+12);cx.closePath();cx.fill();
    cx.fillStyle='#2E7D32';
    cx.beginPath();cx.moveTo(ttx,tty-5);
    cx.lineTo(ttx-5,tty+5);cx.lineTo(ttx+5,tty+5);cx.closePath();cx.fill();
    cx.fillStyle='#43A047';
  }

  /* --- 바다 --- */
  var seaY=mBase+winH*0.02;
  var seaGrd=cx.createLinearGradient(0,seaY,0,winBot);
  seaGrd.addColorStop(0,'#4FC3F7');seaGrd.addColorStop(0.4,'#039BE5');seaGrd.addColorStop(1,'#01579B');
  cx.fillStyle=seaGrd;cx.fillRect(0,seaY,W,winBot-seaY);

  /* 바다 반짝임 */
  cx.fillStyle='rgba(255,255,255,0.12)';
  for(var wi=0;wi<25;wi++){
    var wxx=((wi*127+TICK*0.4)%(W+100))-30+hOff*0.2;
    var wyy=seaY+5+(wi*43%(winBot-seaY-10));
    cx.fillRect(wxx|0,wyy|0,12+wi%15,1);
  }

  /* --- 크루즈 항구 부두 --- */
  var dockY=seaY+winH*0.01;
  cx.fillStyle='#795548';
  cx.fillRect(W*0.25+hOff*0.25,dockY|0,W*0.2,4);
  /* 부두 기둥 */
  cx.fillStyle='#5D4037';
  for(var di=0;di<6;di++){
    cx.fillRect((W*0.26+di*W*0.033+hOff*0.25)|0,(dockY)|0,3,8);
  }

  /* --- 배경 요소 업데이트 --- */
  for(var bi=0;bi<bgEls.length;bi++){
    var b=bgEls[bi];
    b.x+=b.sp;
    if(b.x>1.5)b.x=-0.3;
    if(b.x<-0.4)b.x=1.4;

    var bx=b.x*W+hOff*(b.t==='cloud'?0.15:b.t==='ship'||b.t==='cruise'?0.25:0.1);
    var by=winTop+b.y*winH-vOff*(b.t==='cloud'?0.4:0.2);

    switch(b.t){
      case'cloud':drawCloud(bx,by,b.sz*W,b.op);break;
      case'plane':drawPlane(bx,by,b.sz*W);break;
      case'cruise':drawCruise(bx,by+vOff*0.2,b.sz*W);break;
      case'ship':drawShip(bx,by+vOff*0.2,b.sz*W);break;
      case'para':drawPara(bx,by+Math.sin(TICK*0.04+b.ph)*8,b.sz*W);break;
      case'bird':drawBird(bx,by,b.sz,b.ph);break;
    }
  }
}

function drawCloud(x,y,s,op){cx.globalAlpha=op;cx.fillStyle='#fff';
  rr(x,y,s,s*0.35);rr(x+s*0.15,y-s*0.2,s*0.7,s*0.25);rr(x+s*0.3,y-s*0.32,s*0.4,s*0.18);
  cx.globalAlpha=1;}

function drawPlane(x,y,s){
  cx.fillStyle='#ECEFF1';rr(x,y,s*2,s*0.3);
  cx.fillStyle='#E74C3C';rr(x-s*0.2,y-s*0.15,s*0.35,s*0.5);
  cx.fillStyle='#90A4AE';rr(x+s*0.3,y-s*0.08,s*1,s*0.08);rr(x+s*0.3,y+s*0.25,s*1,s*0.08);
  cx.fillStyle='rgba(255,255,255,0.3)';rr(x-s*0.6,y+s*0.08,s*0.5,s*0.04);
}

function drawCruise(x,y,s){
  /* 크루즈 선체 */
  cx.fillStyle='#263238';
  cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+s*2.5,y);cx.lineTo(x+s*2.2,y+s*0.5);
  cx.lineTo(x+s*0.3,y+s*0.5);cx.closePath();cx.fill();
  /* 상부 구조 */
  cx.fillStyle='#ECEFF1';rr(x+s*0.4,y-s*0.5,s*1.6,s*0.5);
  cx.fillStyle='#B0BEC5';rr(x+s*0.6,y-s*0.8,s*1,s*0.3);
  cx.fillStyle='#78909C';rr(x+s*0.9,y-s*1,s*0.4,s*0.2);
  /* 창문 */
  cx.fillStyle='#4FC3F7';
  for(var i=0;i<8;i++) rr(x+s*0.5+i*s*0.18,y-s*0.4,s*0.1,s*0.08);
  /* 연기 */
  cx.fillStyle='rgba(200,200,200,0.3)';
  rr(x+s*1+Math.sin(TICK*0.02)*3,y-s*1.2,s*0.2,s*0.15);
  rr(x+s*0.9+Math.sin(TICK*0.025)*4,y-s*1.35,s*0.15,s*0.12);
  /* 물결 */
  cx.fillStyle='rgba(255,255,255,0.2)';rr(x-s*0.1,y+s*0.5,s*2.7,s*0.06);
}

function drawShip(x,y,s){
  cx.fillStyle='#5D4037';
  cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+s*1.5,y);cx.lineTo(x+s*1.2,y+s*0.4);
  cx.lineTo(x+s*0.2,y+s*0.4);cx.closePath();cx.fill();
  cx.fillStyle='#F5F5F5';rr(x+s*0.4,y-s*0.6,s*0.08,s*0.6);
  cx.fillStyle='#fff';cx.beginPath();cx.moveTo(x+s*0.48,y-s*0.5);
  cx.lineTo(x+s*0.9,y-s*0.15);cx.lineTo(x+s*0.48,y-s*0.15);cx.closePath();cx.fill();
}

function drawPara(x,y,s){
  cx.fillStyle='#FF7043';cx.beginPath();cx.ellipse(x,y,s*5,s*2,0,Math.PI,0);cx.fill();
  cx.fillStyle='#FFAB91';cx.beginPath();cx.ellipse(x,y,s*3.5,s*1.2,0,Math.PI,0);cx.fill();
  cx.strokeStyle='#795548';cx.lineWidth=1;cx.beginPath();
  cx.moveTo(x-s*2.5,y);cx.lineTo(x,y+s*6);cx.moveTo(x+s*2.5,y);cx.lineTo(x,y+s*6);cx.stroke();
  cx.fillStyle='#FFB74D';rr(x-2,y+s*6,4,5);
  cx.fillStyle='#42A5F5';rr(x-2,y+s*6+5,5,4);
}

function drawBird(x,y,s,ph){
  var wy=Math.sin(TICK*0.15+ph)*s;
  cx.fillStyle='#37474F';cx.beginPath();
  cx.moveTo(x,y);cx.lineTo(x-s*2,y+wy);cx.lineTo(x-s*0.5,y);
  cx.lineTo(x+s*0.5,y);cx.lineTo(x+s*2,y+wy);cx.closePath();cx.fill();
}

function rr(x,y,w,h){cx.fillRect(x|0,y|0,w|0,h|0);}

/* ============================================
   [SEC-7] 창틀 프레임 그리기
   ============================================ */
function drawWindowFrame(){
  var winTop=34;
  var winH=H*0.48-viewY*H*0.15;
  var winBot=winTop+winH;
  var frameW=6;

  /* 창틀 외곽 프레임 — 다크그레이 알루미늄 */
  cx.fillStyle='#37474F';
  /* 상단 */
  rr(0,winTop,W,frameW);
  /* 하단 (창턱) */
  rr(0,winBot-frameW,W,frameW+4);
  /* 좌 */
  rr(0,winTop,frameW,winH);
  /* 우 */
  rr(W-frameW,winTop,frameW,winH);

  /* 세로 프레임 (통유리 분할) */
  var cols=6;
  for(var i=1;i<cols;i++){
    var fx=W*i/cols;
    cx.fillStyle='#455A64';
    rr(fx-2,winTop,4,winH);
  }

  /* 가로 중간 프레임 */
  var midY=winTop+winH*0.5;
  cx.fillStyle='#455A64';
  rr(0,midY-1.5,W,3);

  /* 창턱 디테일 — 밝은 면 */
  cx.fillStyle='#546E7A';
  rr(0,winBot-2,W,2);
  cx.fillStyle='#607D8B';
  rr(0,winBot+2,W,6);

  /* 유리 반사 효과 */
  cx.globalAlpha=0.04;
  cx.fillStyle='#fff';
  for(var gi=0;gi<cols;gi++){
    var gx=W*gi/cols+10;
    rr(gx,winTop+10,30,winH-20);
  }
  cx.globalAlpha=1;

  /* 대각선 빛 줄기 */
  cx.save();
  cx.globalAlpha=0.02+Math.sin(TICK*0.008)*0.01;
  cx.fillStyle='#fff';
  cx.beginPath();
  cx.moveTo(W*0.3,winTop);cx.lineTo(W*0.5,winTop);
  cx.lineTo(W*0.1,winBot);cx.lineTo(-20,winBot);cx.closePath();cx.fill();
  cx.restore();
}

/* ============================================
   [SEC-8] 바닥 & 천장 그리기
   ============================================ */
function drawFloor(){
  var winBot=34+H*0.48-viewY*H*0.15;
  var floorH=H-winBot;

  /* 바닥 — 밝은 오크 나무 */
  var floorGrd=cx.createLinearGradient(0,winBot,0,H);
  floorGrd.addColorStop(0,'#F5E6CA');
  floorGrd.addColorStop(0.3,'#EFD9B4');
  floorGrd.addColorStop(1,'#E8CDA0');
  cx.fillStyle=floorGrd;
  cx.fillRect(0,winBot|0,W,floorH);

  /* 나무결 패턴 */
  cx.fillStyle='rgba(0,0,0,0.015)';
  var plankW=80;
  for(var px=0;px<W;px+=plankW){
    cx.fillRect(px|0,winBot|0,1,floorH);
  }
  /* 가로줄 */
  cx.fillStyle='rgba(0,0,0,0.01)';
  for(var py=winBot;py<H;py+=plankW*0.6){
    cx.fillRect(0,py|0,W,1);
  }

  /* 천장 (창 위 약간) — 화이트 */
  cx.fillStyle='#F5F5F5';
  cx.fillRect(0,0,W,34);

  /* 천장 조명 */
  for(var li=0;li<5;li++){
    var lx=W*0.12+li*W*0.19;
    /* 조명 기구 */
    cx.fillStyle='#E0E0E0';
    rr(lx-20,34,40,4);
    cx.fillStyle='#FAFAFA';
    rr(lx-15,38,30,3);
    /* 빛 원뿔 */
    cx.save();
    cx.globalAlpha=0.03;
    cx.fillStyle='#FFFDE7';
    cx.beginPath();
    cx.moveTo(lx-15,41);cx.lineTo(lx+15,41);
    cx.lineTo(lx+50,H*0.6);cx.lineTo(lx-50,H*0.6);
    cx.closePath();cx.fill();
    cx.restore();
  }

  /* 벽면 (좌우) */
  cx.fillStyle='#FAFAFA';
  rr(0,34,8,H-34);
  rr(W-8,34,8,H-34);
  cx.fillStyle='#E0E0E0';
  rr(0,34,3,H-34);
  rr(W-3,34,3,H-34);
}

/* ============================================
   [SEC-9] 가구 렌더링 — 이케아 스타일 픽셀아트
   ============================================ */
function drawFurniture(){
  var winBot=34+H*0.48-viewY*H*0.15;

  for(var i=0;i<furniture.length;i++){
    var f=furniture[i];
    if(f.floor!==curFloor) continue;

    var fx=f.rx*W+(viewX-0.5)*-80;
    var fy=winBot+(f.ry-0.48)*H*1.1+viewY*30;
    var fw=f.w*viewZoom;
    var fh=f.h*viewZoom;

    switch(f.type){
      case'desk': drawDesk(fx,fy,fw,fh); break;
      case'monitor': drawMonitor(fx,fy,fw,fh); break;
      case'chair': drawChair(fx,fy,fw,fh); break;
      case'sofa': drawSofa(fx,fy,fw,fh); break;
      case'ctable': drawCoffeeTable(fx,fy,fw,fh); break;
      case'plant': drawPlant(fx,fy,fw,fh); break;
      case'counter': drawCounter(fx,fy,fw,fh); break;
      case'coffee': drawCoffeeMachine(fx,fy,fw,fh); break;
      case'stool': drawStool(fx,fy,fw,fh); break;
      case'bookshelf': drawBookshelf(fx,fy,fw,fh); break;
      case'whiteboard': drawWhiteboard(fx,fy,fw,fh); break;
      case'printer': drawPrinter(fx,fy,fw,fh); break;
      case'water': drawWaterCooler(fx,fy,fw,fh); break;
      case'mtable': drawMeetingTable(fx,fy,fw,fh); break;
      case'mchair': drawMeetingChair(fx,fy,fw,fh); break;
      case'screen': drawScreen(fx,fy,fw,fh); break;
    }
  }
}

/* --- 개별 가구 픽셀 아트 함수들 --- */

/** [FURN] 책상 — 이케아 BEKANT 스타일 */

/** [FURN] 모니터 */
function drawMonitor(x,y,w,h){

/** [FURN] 의자 — 이케아 MARKUS 스타일 */

/** [FURN] 커피 테이블 */
function drawCoffeeTable(x,y,w,h){

/* ============================================
   [SEC-10] 캐릭터 렌더링 — 100가지 스타일
   ============================================ */
function drawPerson(p){
  if(p.floor!==curFloor) return;

  var winBot=34+H*0.48-viewY*H*0.15;
  var px=p.rx*W+(viewX-0.5)*-80;
  var py=winBot+(p.ry-0.48)*H*1.1+viewY*30;
  var s=1.5*viewZoom; /* 스프라이트 스케일 */

  /* 화면 밖 컬링 */
  if(px<-40||px>W+40||py<0||py>H+40) return;

  /* 걷기 애니메이션 */
  var legOff=0,armOff=0;
  if(p.walking&&p.tx!==null){
    legOff=[0,-1,0,1][p.frame];
    armOff=[0,1,0,-1][p.frame];
  }

  /* 앉아있는 사람 */
  var sitOff=p.sitting?-3:0;

  /* 호버/선택 글로우 */
  if(p===hoverPerson||p.selected){
    cx.shadowColor=p.selected?'#4ECDC4':'#FFD93D';
    cx.shadowBlur=12;
  }

  /* --- 그림자 --- */
  cx.fillStyle='rgba(0,0,0,0.1)';
  cx.beginPath();cx.ellipse(px+8*s,py+24*s,7*s,2*s,0,0,Math.PI*2);cx.fill();

  /* --- 다리 --- */
  if(!p.sitting){
    cx.fillStyle=p.pants;
    rr(px+(5+legOff)*s,py+17*s,3*s,5*s);
    rr(px+(9-legOff)*s,py+17*s,3*s,5*s);
    cx.fillStyle='#1A1A1A';
    rr(px+(4+legOff)*s,py+22*s,4*s,2*s);
    rr(px+(9-legOff)*s,py+22*s,4*s,2*s);
  } else {
    /* 앉은 다리 */
    cx.fillStyle=p.pants;
    rr(px+4*s,py+17*s+sitOff,4*s,3*s);
    rr(px+9*s,py+17*s+sitOff,4*s,3*s);
    cx.fillStyle='#1A1A1A';
    rr(px+4*s,py+20*s+sitOff,4*s,2*s);
    rr(px+9*s,py+20*s+sitOff,4*s,2*s);
  }

  /* --- 몸통 --- */
  cx.fillStyle=p.shirt;
  rr(px+4*s,py+9*s+sitOff,9*s,8*s);
  /* 셔츠 디테일 */
  if(p.id%4===0){cx.fillStyle='rgba(255,255,255,0.15)';rr(px+4*s,py+11*s+sitOff,9*s,s);rr(px+4*s,py+14*s+sitOff,9*s,s);}
  else if(p.id%4===1){cx.fillStyle='rgba(255,255,255,0.35)';rr(px+5*s,py+9*s+sitOff,7*s,2*s);}
  else if(p.id%4===2){cx.fillStyle='rgba(0,0,0,0.08)';rr(px+7*s,py+10*s+sitOff,3*s,6*s);}

  /* --- 팔 --- */
  cx.fillStyle=p.skin;
  if(p.state.indexOf('커피')>-1){
    /* 커피 들고 있는 포즈 */
    rr(px+2*s,py+10*s+sitOff,2*s,4*s);
    rr(px+13*s,py+10*s+sitOff,2*s,3*s);
    /* 컵 */
    cx.fillStyle='#fff';rr(px+13*s,py+13*s+sitOff,3*s,4*s);
    cx.fillStyle='#795548';rr(px+13.5*s,py+13.5*s+sitOff,2*s,2.5*s);
    /* 스팀 */
    cx.fillStyle='rgba(255,255,255,0.3)';
    rr(px+14*s,py+11*s+sitOff+Math.sin(TICK*0.15)*s,s,2*s);
  } else {
    rr(px+(2+armOff)*s,py+10*s+sitOff,2*s,6*s);
    rr(px+(13-armOff)*s,py+10*s+sitOff,2*s,6*s);
  }
  /* 소매 */
  cx.fillStyle=p.shirt;
  rr(px+(2+armOff)*s,py+10*s+sitOff,2*s,2*s);
  rr(px+(13-armOff)*s,py+10*s+sitOff,2*s,2*s);

  /* --- 머리 --- */
  cx.fillStyle=p.skin;
  rr(px+4*s,py+1*s+sitOff,8*s,8*s);

  /* 눈 */
  if(p.dir!==2){
    cx.fillStyle='#222';
    var exL=p.dir===1?5:p.dir===3?7:6;
    var exR=p.dir===1?8:p.dir===3?11:10;
    rr(px+exL*s,py+4*s+sitOff,s,2*s);
    rr(px+exR*s,py+4*s+sitOff,s,2*s);
    cx.fillStyle='#fff';
    rr(px+exL*s,py+4*s+sitOff,s,s);
    rr(px+exR*s,py+4*s+sitOff,s,s);
    /* 입 */
    cx.fillStyle=p.bubble?'#E57373':'#CC9999';
    rr(px+7*s,py+7*s+sitOff,(p.bubble?3:2)*s,s);
    /* 볼터치 */
    cx.fillStyle='rgba(255,150,150,0.25)';
    rr(px+4*s,py+6*s+sitOff,2*s,s);
    rr(px+11*s,py+6*s+sitOff,2*s,s);
  }

  /* --- 머리카락 --- */
  cx.fillStyle=p.hair;
  switch(p.hstyle){
    case'short':rr(px+4*s,py+sitOff,8*s,3*s);rr(px+3*s,py+s+sitOff,2*s,3*s);rr(px+11*s,py+s+sitOff,2*s,3*s);break;
    case'long':rr(px+3*s,py+sitOff,10*s,3*s);rr(px+3*s,py+s+sitOff,2*s,7*s);rr(px+12*s,py+s+sitOff,2*s,7*s);break;
    case'mohawk':rr(px+6*s,py-2*s+sitOff,4*s,4*s);rr(px+7*s,py-3*s+sitOff,2*s,2*s);break;
    case'bun':rr(px+4*s,py+sitOff,8*s,2*s);rr(px+6*s,py-2*s+sitOff,4*s,3*s);break;
    case'curly':rr(px+3*s,py-s+sitOff,10*s,4*s);rr(px+2*s,py+s+sitOff,3*s,4*s);rr(px+12*s,py+s+sitOff,3*s,4*s);break;
    case'ponytail':rr(px+4*s,py+sitOff,8*s,3*s);rr(px+11*s,py+2*s+sitOff,3*s,8*s);break;
    case'buzz':rr(px+4*s,py+sitOff,8*s,2*s);break;
    case'side':rr(px+3*s,py+sitOff,10*s,3*s);rr(px+3*s,py+s+sitOff,3*s,5*s);break;
    case'afro':rr(px+2*s,py-2*s+sitOff,12*s,5*s);rr(px+s,py+sitOff,3*s,5*s);rr(px+12*s,py+sitOff,3*s,5*s);break;
    case'bald':break;
  }

  /* --- 액세서리 --- */
  switch(p.acc){
    case'glasses':if(p.dir===0){cx.fillStyle='#333';rr(px+5*s,py+3.5*s+sitOff,3*s,2.5*s);rr(px+9*s,py+3.5*s+sitOff,3*s,2.5*s);rr(px+8*s,py+4*s+sitOff,s,s);}break;
    case'sunglasses':if(p.dir===0){cx.fillStyle='#1A1A1A';rr(px+5*s,py+3*s+sitOff,3*s,3*s);rr(px+9*s,py+3*s+sitOff,3*s,3*s);rr(px+8*s,py+4*s+sitOff,s,s);}break;
    case'hat':cx.fillStyle='#5D4037';rr(px+2*s,py-s+sitOff,12*s,2*s);rr(px+4*s,py-4*s+sitOff,8*s,4*s);break;
    case'cap':cx.fillStyle=p.shirt;rr(px+3*s,py-s+sitOff,11*s,2*s);rr(px+4*s,py-2*s+sitOff,8*s,2*s);break;
    case'headband':cx.fillStyle='#E74C3C';rr(px+4*s,py+s+sitOff,8*s,s);break;
    case'earring':cx.fillStyle='#FFD700';rr(px+3*s,py+5*s+sitOff,s,s);break;
    case'mask':if(p.dir===0){cx.fillStyle='#fff';rr(px+5*s,py+6*s+sitOff,6*s,3*s);}break;
    case'scarf':cx.fillStyle='#E74C3C';rr(px+4*s,py+8*s+sitOff,9*s,2*s);break;
    case'bowtie':cx.fillStyle='#E74C3C';rr(px+6*s,py+9*s+sitOff,4*s,2*s);cx.fillStyle='#B71C1C';rr(px+7*s,py+9.5*s+sitOff,2*s,s);break;
  }

  /* 그림자 리셋 */
  cx.shadowBlur=0;

  /* --- 선택 마커 --- */
  if(p.selected){
    cx.strokeStyle='#4ECDC4';cx.lineWidth=2;cx.setLineDash([3,2]);
    cx.strokeRect(px-2,py-6+sitOff,18*s,28*s);cx.setLineDash([]);
  }

  /* --- 이름 태그 --- */
  cx.font='bold 9px "Segoe UI",sans-serif';cx.textAlign='center';
  cx.fillStyle='rgba(0,0,0,0.4)';cx.fillText(p.name,px+8*s+1,py-5+sitOff+1);
  cx.fillStyle=p.selected?'#4ECDC4':'rgba(60,60,60,0.9)';
  cx.fillText(p.name,px+8*s,py-5+sitOff);

  /* --- 말풍선 --- */
  if(p.bubble&&p.bubble.timer>0){
    drawBubble(px+8*s,py-18+sitOff,p.bubble.text,p.bubble.type);
  }

  /* --- 이모지 --- */
  if(p.emoji&&p.emoji.timer>0){
    cx.font='16px serif';cx.textAlign='center';
    var emoY=py-22+sitOff-(60-p.emoji.timer)*0.5;
    cx.globalAlpha=Math.min(1,p.emoji.timer/20);
    cx.fillText(p.emoji.char,px+8*s,emoY);
    cx.globalAlpha=1;
  }

  /* 히트박스 저장 (클릭/호버 감지용) */
  p._sx=px;p._sy=py+sitOff;p._sw=18*s;p._sh=26*s;
}

/** 말풍선 */
function drawBubble(x,y,text,type){
  cx.font='10px "Segoe UI",sans-serif';
  var tw=cx.measureText(text).width;
  var bw=Math.min(tw+14,180);
  var bh=20;
  var bx=x-bw/2,by=y-bh-6;

  cx.fillStyle=type==='dm'?'rgba(239,83,80,0.9)':'rgba(255,255,255,0.93)';
  cx.beginPath();
  cx.moveTo(bx+5,by);cx.lineTo(bx+bw-5,by);
  cx.quadraticCurveTo(bx+bw,by,bx+bw,by+5);cx.lineTo(bx+bw,by+bh-5);
  cx.quadraticCurveTo(bx+bw,by+bh,bx+bw-5,by+bh);
  cx.lineTo(x+4,by+bh);cx.lineTo(x,by+bh+5);cx.lineTo(x-3,by+bh);
  cx.lineTo(bx+5,by+bh);cx.quadraticCurveTo(bx,by+bh,bx,by+bh-5);
  cx.lineTo(bx,by+5);cx.quadraticCurveTo(bx,by,bx+5,by);cx.closePath();cx.fill();

  cx.strokeStyle=type==='dm'?'rgba(200,60,60,0.3)':'rgba(0,0,0,0.1)';cx.lineWidth=1;cx.stroke();

  cx.fillStyle=type==='dm'?'#fff':'#333';cx.textAlign='center';
  var dt2=text.length>22?text.substring(0,21)+'…':text;
  cx.fillText(dt2,x,by+14);
}

/* ============================================
   [SEC-11] 물리엔진 — 사람-사람, 사람-가구 충돌
   ============================================ */
function physics(){
  var i,j,p,q,dx,dy,dist,overlap,nx,ny;

  for(i=0;i<people.length;i++){
    p=people[i];
    if(p.floor!==curFloor) continue;

    /* --- 이동 목표 추적 --- */
    if(p.tx!==null){
      dx=p.tx-p.rx;
      dy=p.ty-p.ry;
      dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>0.005){
        var spd=p.selected?0.004:0.002;
        p.vx=dx/dist*spd;
        p.vy=dy/dist*spd;
        p.walking=true;
        /* 방향 */
        if(Math.abs(dx)>Math.abs(dy)) p.dir=dx>0?3:1;
        else p.dir=dy>0?0:2;
        /* 걷기 프레임 */
        p.animT++;
        if(p.animT>8){p.frame=(p.frame+1)%4;p.animT=0;}
      } else {
        p.tx=null;p.ty=null;
        p.vx*=0.5;p.vy*=0.5;
        if(!p.state.match(/이동|인사|카페/)) p.walking=false;
      }
    }

    /* --- 속도 적용 --- */
    p.rx+=p.vx;
    p.ry+=p.vy;

    /* --- 마찰 --- */
    p.vx*=0.92;
    p.vy*=0.92;
    if(Math.abs(p.vx)<0.0001)p.vx=0;
    if(Math.abs(p.vy)<0.0001)p.vy=0;

    /* --- 경계 제한 --- */
    p.rx=Math.max(0.05,Math.min(0.95,p.rx));
    p.ry=Math.max(0.52,Math.min(0.90,p.ry));
  }

  /* --- 사람-사람 충돌 --- */
  var floorPeople=people.filter(function(pp){return pp.floor===curFloor;});
  for(i=0;i<floorPeople.length;i++){
    for(j=i+1;j<floorPeople.length;j++){
      p=floorPeople[i];
      q=floorPeople[j];
      dx=q.rx-p.rx;
      dy=q.ry-p.ry;
      dist=Math.sqrt(dx*dx+dy*dy);
      var minDist=0.025; /* 최소 거리 (비율) */
      if(dist<minDist&&dist>0){
        overlap=(minDist-dist)/2;
        nx=dx/dist;
        ny=dy/dist;
        p.rx-=nx*overlap;
        p.ry-=ny*overlap;
        q.rx+=nx*overlap;
        q.ry+=ny*overlap;
        /* 속도 교환 (탄성 충돌) */
        var tmpvx=p.vx;var tmpvy=p.vy;
        p.vx=q.vx*0.3;p.vy=q.vy*0.3;
        q.vx=tmpvx*0.3;q.vy=tmpvy*0.3;
      }
    }
  }

  /* --- 사람-가구 충돌 --- */
  for(i=0;i<floorPeople.length;i++){
    p=floorPeople[i];
    for(j=0;j<furniture.length;j++){
      var f=furniture[j];
      if(f.floor!==curFloor) continue;
      /* 가구를 통과 못하는 타입만 */
      if(f.type==='desk'||f.type==='counter'||f.type==='mtable'||f.type==='bookshelf'){
        var fHalfW=f.w*0.5/W;
        var fHalfH=f.h*0.5/H;
        dx=p.rx-f.rx;
        dy=p.ry-f.ry;
        var overX=fHalfW+0.012-Math.abs(dx);
        var overY=fHalfH+0.008-Math.abs(dy);
        if(overX>0&&overY>0){
          if(overX<overY){
            p.rx+=dx>0?overX:-overX;
            p.vx=0;
          } else {
            p.ry+=dy>0?overY:-overY;
            p.vy=0;
          }
        }
      }
    }
  }
}

/* ============================================
   [SEC-12] NPC AI — 상태별 행동
   ============================================ */
function updateAI(){
  for(var i=0;i<people.length;i++){
    var p=people[i];
    if(p.selected) continue; /* 선택된 사람은 AI 중지 */

    p.aiTimer--;
    if(p.aiTimer<=0){
      var r=Math.random();
      if(r<0.3&&!p.sitting){
        /* 걸어다니기 */
        p.tx=0.08+Math.random()*0.84;
        p.ty=0.52+Math.random()*0.36;
        p.aiTimer=150+Math.random()*250|0;
      } else if(r<0.6){
        /* 멈춤 */
        p.tx=null;p.ty=null;
        p.walking=false;
        p.aiTimer=80+Math.random()*200|0;
      } else if(r<0.8){
        /* 말하기 */
        p.bubble={text:NPC_PHRASES[Math.random()*NPC_PHRASES.length|0],timer:100+Math.random()*60|0,type:'all'};
        p.aiTimer=100+Math.random()*100|0;
      } else {
        /* 이모지 */
        var emojis=['😀','😂','🎉','❤️','👍','🔥','💡','☕','✨','😎','🤔','👋','💪'];
        p.emoji={char:emojis[Math.random()*emojis.length|0],timer:60};
        p.aiTimer=60+Math.random()*120|0;
      }
    }

    /* 타이머 감소 */
    if(p.bubble){p.bubble.timer--;if(p.bubble.timer<=0)p.bubble=null;}
    if(p.emoji){p.emoji.timer--;if(p.emoji.timer<=0)p.emoji=null;}
  }
}

/* ============================================
   [SEC-13] 마우스/터치 입력
   ============================================ */
var mouseDown=false;

canvas.addEventListener('mousemove',function(e){
  mx=e.clientX;my=e.clientY;
  /* 호버 감지 */
  hoverPerson=null;
  var floorP=people.filter(function(p){return p.floor===curFloor;});
  for(var i=floorP.length-1;i>=0;i--){
    var p=floorP[i];
    if(p._sx!==undefined&&mx>=p._sx&&mx<=p._sx+p._sw&&my>=p._sy&&my<=p._sy+p._sh){
      hoverPerson=p;
      cv.style.cursor='pointer';
      /* 툴팁 표시 */
      var tt=document.getElementById('tooltip');
      tt.style.display='block';
      tt.style.left=Math.min(mx+15,W-230)+'px';
      tt.style.top=Math.min(my-10,H-80)+'px';
      tt.querySelector('.tname').textContent=p.name+(p.selected?' (선택됨)':'');
      tt.querySelector('.tstate').textContent=p.state;
      tt.querySelector('.tloc').textContent=curFloor+'F | 위치('+Math.round(p.rx*100)+','+Math.round(p.ry*100)+')';
      return;
    }
  }
  cv.style.cursor='default';
  document.getElementById('tooltip').style.display='none';
});

canvas.addEventListener('click',function(e){
  var clickX=e.clientX,clickY=e.clientY;

  /* 사람 클릭 검사 */
  var floorP=people.filter(function(p){return p.floor===curFloor;});
  var clicked=null;
  for(var i=floorP.length-1;i>=0;i--){
    var p=floorP[i];
    if(p._sx!==undefined&&clickX>=p._sx&&clickX<=p._sx+p._sw&&clickY>=p._sy&&clickY<=p._sy+p._sh){
      clicked=p;break;
    }
  }

  if(clicked){
    /* 이전 선택 해제 */
    if(selPerson&&selPerson!==clicked) selPerson.selected=false;
    clicked.selected=!clicked.selected;
    selPerson=clicked.selected?clicked:null;
  } else if(selPerson){
    /* 빈 공간 클릭 → 선택된 사람 이동 */
    var winBot=34+H*0.48-viewY*H*0.15;
    var targetRx=(clickX-(viewX-0.5)*-80)/W;
    var targetRy=(clickY-winBot-viewY*30)/(H*1.1)+0.48;
    targetRx=Math.max(0.05,Math.min(0.95,targetRx));
    targetRy=Math.max(0.52,Math.min(0.90,targetRy));
    selPerson.tx=targetRx;
    selPerson.ty=targetRy;
    selPerson.sitting=false;
    selPerson.state='🚶 이동 중';
  }
});

canvas.addEventListener('dblclick',function(e){
  if(hoverPerson&&hoverPerson!==selPerson){
    /* 더블클릭으로 DM 설정 */
    dmTgt=hoverPerson.id;
    chatMode='dm';
    document.getElementById('chatP').classList.add('open');
    document.getElementById('chatTgt').style.display='block';
    document.getElementById('tgtN').textContent=hoverPerson.name;
    document.getElementById('msgI').placeholder=hoverPerson.name+'에게 DM...';
    document.getElementById('msgI').focus();
    var tabs=document.querySelectorAll('.ct');
    tabs.forEach(function(t){t.classList.remove('on')});
    tabs[1].classList.add('on');
  }
});

canvas.addEventListener('mouseleave',function(){
  document.getElementById('tooltip').style.display='none';
});

/* 터치 */
var touchSX=0,touchSY=0;
canvas.addEventListener('touchstart',function(e){
  var t=e.touches[0];touchSX=t.clientX;touchSY=t.clientY;
},{passive:true});
canvas.addEventListener('touchmove',function(e){
  var t=e.touches[0];
  viewX+=-(t.clientX-touchSX)*0.001;
  viewY+=(t.clientY-touchSY)*0.001;
  viewX=Math.max(0,Math.min(1,viewX));
  viewY=Math.max(0,Math.min(1,viewY));
  touchSX=t.clientX;touchSY=t.clientY;
},{passive:true});

/* ============================================
   [SEC-14] 키보드 입력 — 뷰 이동
   ============================================ */
var keys={};
document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='Enter'){
    var cp=document.getElementById('chatP');
    var inp=document.getElementById('msgI');
    if(cp.classList.contains('open')&&document.activeElement===inp){
      sendMsg(inp.value);inp.value='';
    } else {
      cp.classList.add('open');
      setTimeout(function(){inp.focus()},100);
    }
    e.preventDefault();
  }
  if(e.code==='Escape'){
    document.getElementById('chatP').classList.remove('open');
    document.getElementById('helpM').style.display='none';
    document.getElementById('helpO').style.display='none';
  }
  if(document.activeElement.tagName!=='INPUT'){
    if(e.code==='Digit1')switchFloor(15);
    if(e.code==='Digit2')switchFloor(14);
    if(e.code==='Digit3')switchFloor(13);
    if(e.code==='Equal')viewZoom=Math.min(2.5,viewZoom+0.1);
    if(e.code==='Minus')viewZoom=Math.max(0.5,viewZoom-0.1);
  }
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});

function handleViewKeys(){
  var spd=0.008;
  if(keys['KeyW']||keys['ArrowUp'])viewY=Math.max(0,viewY-spd);
  if(keys['KeyS']||keys['ArrowDown'])viewY=Math.min(1,viewY+spd);
  if(keys['KeyA']||keys['ArrowLeft'])viewX=Math.max(0,viewX-spd);
  if(keys['KeyD']||keys['ArrowRight'])viewX=Math.min(1,viewX+spd);
}

/* ============================================
   [SEC-15] 채팅 시스템
   ============================================ */
function sendMsg(text){
  if(!text||!text.trim())return;
  text=text.trim();
  var msg={from:'나',fromId:-1,text:text,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),type:chatMode,target:null};
  if(chatMode==='dm'&&dmTgt!==null){
    msg.type='dm';
    msg.target=people[dmTgt].name;
    /* DM 대상 반응 */
    setTimeout(function(){
      if(people[dmTgt])
        people[dmTgt].bubble={text:NPC_PHRASES[Math.random()*NPC_PHRASES.length|0],timer:120,type:'dm'};
    },600+Math.random()*1000);
  }
  chatMsgs.push(msg);
  renderMsgs();
  /* 내 말풍선 */
  if(selPerson) selPerson.bubble={text:text,timer:100,type:msg.type};
}

function renderMsgs(){
  var c=document.getElementById('chatMsgs');c.innerHTML='';
  var msgs=chatMode==='dm'?chatMsgs.filter(function(m){return m.type==='dm'}):chatMsgs;
  var start=Math.max(0,msgs.length-40);
  for(var i=start;i<msgs.length;i++){
    var m=msgs[i];
    var d=document.createElement('div');
    d.className='cm '+(m.fromId===-1?'me':'ot');
    var h='<b>'+m.from;
    if(m.type==='dm')h+=' <span style="color:#FF6B6B;font-size:8px">→ '+m.target+'</span>';
    h+=' <span style="opacity:.4;font-weight:400">'+m.time+'</span></b>';
    d.innerHTML=h+m.text;
    c.appendChild(d);
  }
  c.scrollTop=c.scrollHeight;
}

/* ============================================
   [SEC-16] UI 이벤트 바인딩
   ============================================ */
document.getElementById('msgB').addEventListener('click',function(){
  var inp=document.getElementById('msgI');sendMsg(inp.value);inp.value='';inp.focus();
});
document.getElementById('chatX').addEventListener('click',function(){
  document.getElementById('chatP').classList.remove('open');
});
document.querySelectorAll('.ct').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.ct').forEach(function(t2){t2.classList.remove('on')});
    this.classList.add('on');
    chatMode=this.getAttribute('data-m');
    if(chatMode!=='dm'){dmTgt=null;document.getElementById('chatTgt').style.display='none';document.getElementById('msgI').placeholder='Enter로 채팅...';}
    renderMsgs();
  });
});
document.getElementById('tgtC').addEventListener('click',function(){
  dmTgt=null;chatMode='all';
  document.getElementById('chatTgt').style.display='none';
  document.getElementById('msgI').placeholder='Enter로 채팅...';
  document.querySelectorAll('.ct').forEach(function(t){t.classList.remove('on')});
  document.querySelectorAll('.ct')[0].classList.add('on');
  renderMsgs();
});
document.getElementById('bChat').addEventListener('click',function(){document.getElementById('chatP').classList.toggle('open');});
document.getElementById('bUp').addEventListener('click',function(){viewY=Math.max(0,viewY-0.08);});
document.getElementById('bDown').addEventListener('click',function(){viewY=Math.min(1,viewY+0.08);});
document.getElementById('bZoomIn').addEventListener('click',function(){viewZoom=Math.min(2.5,viewZoom+0.15);});
document.getElementById('bZoomOut').addEventListener('click',function(){viewZoom=Math.max(0.5,viewZoom-0.15);});
document.getElementById('bHelp').addEventListener('click',function(){document.getElementById('helpM').style.display='block';document.getElementById('helpO').style.display='block';});
document.getElementById('hx').addEventListener('click',function(){document.getElementById('helpM').style.display='none';document.getElementById('helpO').style.display='none';});
document.getElementById('helpO').addEventListener('click',function(){document.getElementById('helpM').style.display='none';document.getElementById('helpO').style.display='none';});

document.querySelectorAll('.fbtn').forEach(function(b){
  b.addEventListener('click',function(){switchFloor(parseInt(this.getAttribute('data-f')))});
});

function switchFloor(f){
  curFloor=f;
  document.querySelectorAll('.fbtn').forEach(function(b){b.classList.toggle('on',parseInt(b.getAttribute('data-f'))===f)});
  if(selPerson){selPerson.selected=false;selPerson=null;}
}

/* ============================================
   [SEC-17] 미니맵 (우하단)
   ============================================ */
function drawMinimap(){
  var mw=130,mh=70;
  var mx2=W-mw-12,my2=H-mh-55;
  /* 배경 */
  cx.fillStyle='rgba(0,0,0,0.5)';
  cx.fillRect(mx2-1,my2-1,mw+2,mh+2);
  cx.fillStyle='rgba(245,230,202,0.6)';
  cx.fillRect(mx2,my2,mw,mh);
  /* 가구 점 */
  cx.fillStyle='rgba(0,0,0,0.15)';
  for(var i=0;i<furniture.length;i++){
    var f=furniture[i];
    if(f.floor!==curFloor)continue;
    cx.fillRect(mx2+f.rx*mw|0,my2+((f.ry-0.48)/0.44)*mh|0,f.w*mw/W|0||1,f.h*mh/H|0||1);
  }
  /* 사람 점 */
  var fp=people.filter(function(p){return p.floor===curFloor});
  for(var j=0;j<fp.length;j++){
    var p=fp[j];
    cx.fillStyle=p.selected?'#4ECDC4':p===hoverPerson?'#FFD93D':'#E74C3C';
    cx.fillRect(mx2+p.rx*mw|0,my2+((p.ry-0.48)/0.44)*mh|0,3,3);
  }
  /* 테두리 */
  cx.strokeStyle='rgba(255,255,255,0.2)';cx.lineWidth=1;
  cx.strokeRect(mx2,my2,mw,mh);
  /* 레이블 */
  cx.fillStyle='rgba(255,255,255,0.5)';cx.font='8px sans-serif';cx.textAlign='left';
  cx.fillText(curFloor+'F',mx2+3,my2+mh-3);
}

/* ============================================
   [SEC-18] 메인 게임 루프
   ============================================ */
function loop(){
  requestAnimationFrame(loop);
  TICK++;

  /* 뷰 키 입력 */
  handleViewKeys();

  /* AI 업데이트 (5프레임마다) */
  if(TICK%5===0) updateAI();

  /* 물리 */
  physics();

  /* === 렌더링 === */
  cx.clearRect(0,0,W,H);

  /* [1] 배경 — 창밖 뷰 */
  drawBg();

  /* [2] 창틀 프레임 */
  drawWindowFrame();

  /* [3] 바닥 & 천장 & 벽 */
  drawFloor();

  /* [4] 가구 */
  drawFurniture();

  /* [5] 사람 (Y 정렬) */
  var floorPeople=people.filter(function(p){return p.floor===curFloor});
  floorPeople.sort(function(a,b){return a.ry-b.ry});
  for(var i=0;i<floorPeople.length;i++){
    drawPerson(floorPeople[i]);
  }

  /* [6] 미니맵 */
  if(TICK%3===0) drawMinimap();

  /* [7] HUD 업데이트 */
  if(TICK%20===0){
    var cnt=people.filter(function(p){return p.floor===curFloor}).length;
    document.getElementById('info').textContent=cnt+'명 | '+curFloor+'F | view('+Math.round(viewX*100)+','+Math.round(viewY*100)+')';
  }
}

/* ============================================
   [SEC-19] 초기화
   ============================================ */
initPeople();
initFurniture();
initBg();

/* 게임 시작 */
requestAnimationFrame(loop);

console.log('WASD: 뷰이동 | 클릭: 사람선택/이동 | Enter: 채팅 | 1~3: 층이동 | +/-: 줌');

})();
